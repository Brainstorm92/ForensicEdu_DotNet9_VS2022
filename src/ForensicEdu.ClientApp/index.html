<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('forensicedu-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Plataforma Educativa Forense y Certificación Digital</title>
    <meta name="description" content="Sistema integral de cursos forenses, eventos en vivo, control antifraude de pagos, evaluaciones cronometradas (10 min / nota 13), re-evaluaciones, certificación digital con QR público, vigencia de cuentas y panel multirol." />
    <meta property="og:title" content="Plataforma Educativa Forense y Certificación Digital" />
    <meta property="og:description" content="Sistema integral de cursos forenses, eventos en vivo, pagos bancarios con detección de duplicados, evaluaciones cronometradas de 10 min, re-evaluación y certificación con QR." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
