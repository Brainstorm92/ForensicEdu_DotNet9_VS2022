services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ForensicEduDb
      POSTGRES_USER: forensicedu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en un archivo .env local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forensic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensicedu -d ForensicEduDb"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  forensic_pg:
